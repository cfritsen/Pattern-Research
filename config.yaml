index: sp500
data_dir: data
report_dir: reports
start_date: "1996-01-01"
index_proxy: SPY          # open item: SPY is my default pick
use_stooq_fallback: true
jump_threshold: 0.25      # flag daily moves bigger than 25%
pause_seconds: 0.5        # be polite to the data source
start_overrides:
  JCI: "2007-07-02"   # earlier history is Tyco-era, not comparable
horizon: 5
move_atr: 1.0
discovery_frac: 0.70
corr_prune_threshold: 0.7
test_all_buckets: false   # true = full 25-combo grid per pair (much slower)